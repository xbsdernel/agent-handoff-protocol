[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-handoff-protocol"
version = "0.1.0"
description = "Agent Handoff Protocol (AHP) and multi-agent inference benchmarking harness."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "openai>=1.30",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "duckdb>=0.10",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.12",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["ahp", "harness", "engine", "telemetry", "bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]
extend-exclude = [".venv", "notebooks", "runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
